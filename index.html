<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space | Warp Mainframe</title>
    <style>
        /* Celestial Base Architecture and Pointer Resets */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #020308;
            color: #f1f5f9;
            font-family: monospace;
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 1;
            cursor: pointer;
        }

        /* Ambient Low-Opacity Shifting Energy Fields */
        .nebula {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(160px);
            z-index: 2;
            opacity: 0.12;
            pointer-events: none;
            transition: opacity 1s, background 1s;
        }
        .purple { top: -10%; left: -10%; background: #6d28d9; }
        .cyan { bottom: -10%; right: -10%; background: #0e7490; }

        /* Tactile HUD Cockpit Frame Texture */
        .hud-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: linear-gradient(rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 4px 4px;
            pointer-events: none;
            opacity: 0.3;
        }

        .interface-grid {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            height: 100vh;
            justify-content: space-between;
            pointer-events: none; /* Allows mouse clicks to pass directly to canvas background */
        }

        header {
            width: 100%;
            max-w: 1100px;
            display: flex;
            justify-content: space-between;
            color: #334155;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #22d3ee;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #22d3ee;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            max-w: 800px;
            text-align: center;
        }

        /* High-Impact Vector Branding text */
        h1 {
            font-size: clamp(2rem, 7vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -1px;
            color: #ffffff;
            text-transform: uppercase;
            transition: transform 0.3s ease, letter-spacing 0.5s ease;
        }
        h1 span {
            color: #22d3ee;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
            transition: color 0.3s, text-shadow 0.3s;
        }

        .instructions {
            color: #475569;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 1rem;
            animation: breathe 2s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        footer {
            width: 100%;
            max-w: 1100px;
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <!-- Canvas Processing Module -->
    <canvas id="starfield"></canvas>
    <div id="neb-p" class="nebula purple"></div>
    <div id="neb-c" class="nebula cyan"></div>
    <div class="hud-overlay"></div>

    <div class="interface-grid">
        <header>
            <div>Gideon Riggins</div>
            <div><span class="live-dot" id="status-dot"></span><span id="status-text">WARP.READY</span></div>
        </header>

        <main>
            <h1 id="main-title">Gideon<span>.Space</span></h1>
            <div class="instructions" id="instruction-prompt">CLICK AND HOLD MOUSE TO ENGAGE WARP</div>
        </main>

        <footer>
            <div>&copy; 2026 RIGGINS. ALL ENGINE CONTROLS ACTIVE.</div>
            <div>SILENT_DECK_V2</div>
        </footer>
    </div>

    <!-- High-Velocity Matrix Physics Engine Script -->
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 200; // Increased star density for high-fidelity velocity effects
        
        let isWarping = false;
        let warpFactor = 1;
        let targetWarpFactor = 1;
        
        let mouse = { x: 0, y: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Re-center origin vectors to center of screen layout
            ctx.translate(canvas.width / 2, canvas.height / 2);
        }
        window.addEventListener('resize', resize);
        resize();

        // Populate Starfield Vectors relative to center origin points
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: (Math.random() - 0.5) * canvas.width,
                y: (Math.random() - 0.5) * canvas.height,
                z: Math.random() * canvas.width, // Depth axis variable mapping
                color: '#ffffff'
            });
        }

        // Mouse Trajectory Tracking
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX - canvas.width / 2;
            mouse.y = e.clientY - canvas.height / 2;
        });

        // Trigger Hyperspace Overdrive on Click Hold
        window.addEventListener('mousedown', () => {
            isWarping = true;
            targetWarpFactor = 35; // Light speed acceleration vector caps
            document.getElementById('status-text').innerText = "WARP.ACTIVE";
            document.getElementById('status-dot').style.backgroundColor = "#ff0055"; // Hot pink engine state
            document.getElementById('status-dot').style.boxShadow = "0 0 12px #ff0055";
            document.getElementById('instruction-prompt').innerText = "DISENGAGE MOUSE TO DECELLERATE";
            document.getElementById('main-title').style.transform = "scale(0.95)";
            document.getElementById('main-title').style.letterSpacing = "6px";
        });

        window.addEventListener('mouseup', () => {
            isWarping = false;
            targetWarpFactor = 1; // Return to standard orbit values
            document.getElementById('status-text').innerText = "WARP.READY";
            document.getElementById('status-dot').style.backgroundColor = "#22d3ee";
            document.getElementById('status-dot').style.boxShadow = "0 0 8px #22d3ee";
            document.getElementById('instruction-prompt').innerText = "CLICK AND HOLD MOUSE TO ENGAGE WARP";
            document.getElementById('main-title').style.transform = "scale(1)";
            document.getElementById('main-title').style.letterSpacing = "-1px";
        });

        function animate() {
            // Apply slight alpha wipe background transparency loop to generate vector drag line streaks
            ctx.fillStyle = `rgba(2, 3, 8, ${isWarping ? 0.15 : 0.4})`;
            ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            
            // Smoothly interpolate warp factor value shifts
            warpFactor += (targetWarpFactor - warpFactor) * 0.05;

            stars.forEach(star => {
                // Accelerate star tracking forward along the Z depth plane
                star.z -= warpFactor;

                // Loop star fields forward if coordinate boundaries are exceeded
                if (star.z <= 0) {
                    star.z = canvas.width;
                    star.x = (Math.random() - 0.5) * canvas.width;
                    star.y = (Math.random() - 0.5) * canvas.height;
                }

                // Standard projection screen perspective translations (X/Z, Y/Z math models)
                let px = (star.x / star.z) * (canvas.width * 0.6);
                let py = (star.y / star.z) * (canvas.height * 0.6);

                // Draw secondary trailing lines if light speed factor acceleration is active
                let prevZ = star.z + warpFactor * 1.5;
                let p_px = (star.x / prevZ) * (canvas.width * 0.6);
                let p_py = (star.y / prevZ) * (canvas.height * 0.6);

                ctx.beginPath();
                if (isWarping) {
                    // Streaking Neon Light Vectors Configuration
                    ctx.strokeStyle = `rgba(34, 211, 230, ${Math.min(1, 1 - star.z / canvas.width)})`;
                    ctx.lineWidth = Math.min(2, (1 - star.z / canvas.width) * 3);
                    ctx.moveTo(px, py);
                    ctx.lineTo(p_px, p_py);
                    ctx.stroke();
                } else {
                    // Standard Ambient Point Matrix Configuration
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, 1 - star.z / canvas.width)})`;
                    ctx.arc(px, py, Math.min(1.5, (1 - star.z / canvas.width) * 2), 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
