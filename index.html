<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Search Engine</title>
    <style>
        /* Base Setup & Ultra-Minimal Presentation Framework */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #03050c;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Subtle Frosted Low-Opacity Gas Blobs */
        .nebula {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 2;
            opacity: 0.12;
            animation: cosmicDrift 25s infinite alternate ease-in-out;
        }
        .purple { top: -10%; left: -10%; background: #6366f1; }
        .cyan { bottom: -10%; right: -10%; background: #06b6d4; animation-duration: 35s; }

        @keyframes cosmicDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(40px, -40px); }
        }

        .hud-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: linear-gradient(rgba(15, 23, 42, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(15, 23, 42, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 4px 4px;
            pointer-events: none;
            opacity: 0.2;
        }

        .interface-grid {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem;
            height: 100vh;
            justify-content: space-between;
        }

        header {
            width: 100%;
            max-w: 1200px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: #334155;
            text-transform: uppercase;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            max-w: 640px;
            margin: auto;
            text-align: center;
        }

        /* Minimalist Search Branding Vector Logo */
        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        h1 span {
            background: linear-gradient(to right, #06b6d4, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphic Cyber Search Terminal Bar */
        .search-wrapper {
            width: 100%;
            position: relative;
        }
        .search-bar {
            width: 100%;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            padding: 1.1rem 1.5rem;
            padding-left: 3rem;
            border-radius: 9999px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }
        .search-bar:focus {
            border-color: #06b6d4;
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15), 0 20px 40px -10px rgba(0,0,0,0.6);
        }

        /* Magnifying Glass Utility Icon */
        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        /* Filter Switch Row Module */
        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(51, 65, 85, 0.3);
            color: #64748b;
            padding: 6px 16px;
            border-radius: 9999px;
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: #06b6d4;
            color: #06b6d4;
            background: rgba(6, 182, 212, 0.05);
        }

        footer {
            width: 100%;
            max-w: 1200px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.65rem;
            color: #1e293b;
            border-top: 1px solid rgba(51, 65, 85, 0.1);
            padding-top: 1.5rem;
        }
        footer a { color: #1e293b; text-decoration: none; }
        footer a:hover { color: #475569; }
    </style>
</head>
<body>

    <!-- Ambient Animation Layer Backplane -->
    <canvas id="starfield"></canvas>
    <div class="nebula purple"></div>
    <div class="nebula cyan"></div>
    <div class="hud-overlay"></div>

    <div class="interface-grid">
        <header>
            <div>Space Search Engine</div>
            <div style="color: #475569;">Console Live</div>
        </header>

        <main>
            
            <form id="searchForm" onsubmit="executeSearch(event)" style="width: 100%; display: flex; flex-direction: column; gap: 1.5rem; align-items: center;">
                
                <h1>Space<span>.Search</span></h1>
                
                <!-- Central Interactive Bar Framework -->
                <div class="search-wrapper">
                    <svg class="search-icon" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="queryInput" class="search-bar" placeholder="Scan the data expanse..." autocomplete="off" autofocus>
                </div>

                <!-- Engine Filter Presets Switch -->
                <div class="filter-row">
                    <button type="button" class="filter-btn active" onclick="setEngine('google', this)">Google</button>
                    <button type="button" class="filter-btn" onclick="setEngine('images', this)">Images</button>
                    <button type="button" class="filter-btn" onclick="setEngine('github', this)">GitHub</button>
                    <button type="button" class="filter-btn" onclick="setEngine('wikipedia', this)">Wikipedia</button>
                </div>
            </form>
        </main>

        <footer>
            <div>&copy; 2026 GIDEON RIGGINS. ALL RIGHTS RESERVED.</div>
            <div><a href="https://github.com" target="_blank">MAIN_NODE.SRC</a></div>
        </footer>
    </div>

    <!-- Background Star Field Motion Logic -->
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 130;
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                speedX: (Math.random() - 0.5) * 0.12,
                speedY: (Math.random() - 0.5) * 0.12,
                alpha: Math.random()
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX - window.innerWidth / 2) * 0.04;
            mouse.targetY = (e.clientY - window.innerHeight / 2) * 0.04;
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;

                if(star.x < 0) star.x = canvas.width;
                if(star.x > canvas.width) star.x = 0;
                if(star.y < 0) star.y = canvas.height;
                if(star.y > canvas.height) star.y = 0;

                ctx.beginPath();
                ctx.globalAlpha = Math.abs(Math.sin(star.alpha));
                star.alpha += 0.006;
                ctx.arc(star.x + mouse.x * star.size, star.y + mouse.y * star.size, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // REAL-TIME SEARCH ROUTING LOGIC KEYS
        let activeEngine = 'google';

        function setEngine(engineKey, buttonElement) {
            activeEngine = engineKey;
            
            // Remove active style state signature from all toggles
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            // Bind active class anchor onto the user selected target
            buttonElement.classList.add('active');

            // Shift placeholder text vectors seamlessly
            const input = document.getElementById('queryInput');
            if(engineKey === 'google') input.placeholder = "Scan the global web data expanse...";
            if(engineKey === 'images') input.placeholder = "Scan celestial image archives...";
            if(engineKey === 'github') input.placeholder = "Scan public code repositories...";
            if(engineKey === 'wikipedia') input.placeholder = "Scan encyclopedic database records...";
            input.focus();
        }

        function executeSearch(event) {
            event.preventDefault();
            const rawQuery = document.getElementById('queryInput').value.trim();
            if(!rawQuery) return;

            const targetPayload = encodeURIComponent(rawQuery);
            let searchURL = '';

            // Map target routing strings based on active mode keys
            if(activeEngine === 'google') searchURL = `https://google.com{targetPayload}`;
            if(activeEngine === 'images') searchURL = `https://google.com{targetPayload}`;
            if(activeEngine === 'github') searchURL = `https://github.com{targetPayload}`;
            if(activeEngine === 'wikipedia') searchURL = `https://wikipedia.org{targetPayload}`;

            // Open search output array directly onto a clean client target slot
            window.open(searchURL, '_blank');
        }
    </script>
</body>
</html>
