<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gideon Riggins | Photo Archive</title>
    <style>
        /* Modern Setup and Reset Layout Geometry */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #05070c;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-badge {
            font-size: 0.75rem;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 9999px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 🖼️ AUTOMATED MASONRY FLOW PHOTO GRID */
        .photo-gallery {
            column-count: 1;
            column-gap: 1.5rem;
            width: 100%;
        }

        /* Responsive column distribution rules based on monitor size */
        @media (min-width: 480px) { .photo-gallery { column-count: 2; } }
        @media (min-width: 768px) { .photo-gallery { column-count: 3; } }
        @media (min-width: 1024px) { .photo-gallery { column-count: 4; } }

        .photo-card {
            background: #0e111a;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            break-inside: avoid;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
        }

        .photo-card:hover {
            transform: scale(1.02);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            background-color: #090b11; /* Pre-render skeleton backdrop */
        }

        .photo-meta {
            padding: 1rem;
            font-size: 0.8rem;
            color: #475569;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-tag {
            color: #38bdf8;
            font-weight: bold;
        }

        footer {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #1e293b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Gideon Riggins / Photo.Archive</h1>
        <div class="upload-badge">ARCHIVE ONLINE</div>
    </header>

    <main>
        <!-- MULTI-COLUMN MASONRY PHOTO FEED -->
        <div class="photo-gallery">
            
            <!-- CARD 1: CARINA NEBULA -->
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Deep Cosmic Nebula">
                <div class="photo-meta"><span class="photo-tag">#001_CARINA</span><span>CELESTIAL</span></div>
            </div>

            <!-- CARD 2: DIGITAL CORE MATRIX -->
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Digital Matrix Wireframe">
                <div class="photo-meta"><span class="photo-tag">#002_MATRIX</span><span>DATA_CELL</span></div>
            </div>

            <!-- CARD 3: CHRONO SWIRL FLUID -->
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Abstract Fluid Flow Texture">
                <div class="photo-meta"><span class="photo-tag">#003_CHRONO</span><span>ABSTRACT</span></div>
            </div>

            <!-- CARD 4: INFRARED HORIZON -->
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Infrared Horizon Topography">
                <div class="photo-meta"><span class="photo-tag">#004_INFRARED</span><span>VECTOR</span></div>
            </div>

            <!-- CARD 5: STELLAR MAGMA -->
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Stellar Magma Background">
                <div class="photo-meta"><span class="photo-tag">#005_MAGMA</span><span>THERMAL</span></div>
            </div>

            <!-- CARD 6: CYBER MATRIX CORE -->
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Cyber Wireframe Grid Core">
                <div class="photo-meta"><span class="photo-tag">#006_CYBER_CORE</span><span>GRID_NODE</span></div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Gideon Riggins. Media stream processing stable.
    </footer>

</body>
</html>
