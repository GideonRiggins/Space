<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Space</title>
    <style>
        /* Modern Reset and Interactive Canvas Frame Configuration */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background-color: #03050d;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* High-fidelity background canvas layer */
        #starfield {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Fluid Nebula Gas Blobs */
        .nebula {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 2;
            opacity: 0.25;
            animation: cosmicDrift 20s infinite alternate ease-in-out;
        }
        .purple { top: -15%; left: -10%; background: #7c3aed; }
        .cyan { bottom: -15%; right: -10%; background: #06b6d4; animation-duration: 25s; animation-delay: -7s; }

        @keyframes cosmicDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(60px, -60px); }
        }

        /* Screen Grid HUD overlay effect */
        .hud-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: linear-gradient(rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 4px 4px;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Global UI layout grid structural box */
        .interface-grid {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem;
        }

        header {
            width: 100%;
            max-w: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #64748b;
        }
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #22d3ee;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #22d3ee;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            max-w: 750px;
            margin: auto;
            text-align: center;
        }

        /* High-Impact Vector Headline Typography */
        h1 {
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.95;
            background: linear-gradient(to bottom, #ffffff 40%, #cbd5e1 70%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        h1 span {
            background: linear-gradient(to right, #22d3ee, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.2);
        }

        p {
            color: #94a3b8;
            line-height: 1.7;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 300;
            max-w: 540px;
            letter-spacing: 0.5px;
        }

        /* Cyberpunk Interactive Button Capsule */
        .launch-btn {
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid #1e293b;
            padding: 1.2rem 2.5rem;
            color: #94a3b8;
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
            margin-top: 1rem;
        }
        .launch-btn:hover {
            border-color: #22d3ee;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.15);
            transform: translateY(-2px);
        }
        .launch-btn:active {
            transform: translateY(0);
        }

        footer {
            font-family: monospace;
            font-size: 0.65rem;
            color: #334155;
            letter-spacing: 1px;
            width: 100%;
            max-w: 1200px;
            display: flex;
            justify-content: space-between;
        }
        footer a { color: #334155; text-decoration: none; transition: color 0.3s; }
        footer a:hover { color: #64748b; }
    </style>
</head>
<body>

    <!-- Functional Canvas Backplane -->
    <canvas id="starfield"></canvas>
    <div class="nebula purple"></div>
    <div class="nebula cyan"></div>
    <div class="hud-overlay"></div>

    <!-- Screen UI Overlay Grid -->
    <div class="interface-grid">
        <header>
            <div>Cosmic Space</div>
            <div><span class="live-dot"></span>SYS.ONLINE</div>
        </header>

        <main>
            <h1 id="main-heading">Explore The <br><span>Unknown</span></h1>
            <p>Live on the web. Clean, fast, and entirely custom. Step into a lightweight engine engineered for optimal performance across the digital expanse.</p>
            <button class="launch-btn" onclick="activateEngine(this)">Initialize Sequence</button>
        </main>

        <footer>
            <div>&copy; 2026 GIDEON RIGGINS.</div>
            <div><a href="https://github.com" target="_blank">REPOS.SRC</a></div>
        </footer>
    </div>

    <!-- High-Performance Background Engine Vector Script -->
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const numStars = 140;
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Populate Star Matrix Structs
        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8,
                speedX: (Math.random() - 0.5) * 0.15,
                speedY: (Math.random() - 0.5) * 0.15,
                alpha: Math.random(),
                pulse: Math.random() * 0.02
            });
        }

        // Track Cursor Drift Vectors
        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX - window.innerWidth / 2) * 0.05;
            mouse.targetY = (e.clientY - window.innerHeight / 2) * 0.05;
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Smooth mouse transition interpolation
            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            ctx.fillStyle = '#ffffff';
            
            stars.forEach(star => {
                // Update particle tracking positions
                star.x += star.speedX;
                star.y += star.speedY;

                // Loop star fields around margins seamlessly
                if(star.x < 0) star.x = canvas.width;
                if(star.x > canvas.width) star.x = 0;
                if(star.y < 0) star.y = canvas.height;
                if(star.y > canvas.height) star.y = 0;

                // Render vector light structures
                ctx.beginPath();
                ctx.globalAlpha = Math.abs(Math.sin(star.alpha));
                star.alpha += star.pulse;
                
                // Add secondary mouse viewport translation offset matrix
                ctx.arc(star.x + mouse.x * star.size, star.y + mouse.y * star.size, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Control Interface Interactive Sequences
        function activateEngine(btn) {
            btn.innerText = "LINK ESTABLISHED";
            btn.style.borderColor = "#22d3ee";
            btn.style.color = "#22d3ee";
            btn.style.boxShadow = "0 0 35px rgba(34, 211, 238, 0.4)";
            
            const head = document.getElementById('main-heading');
            head.style.transform = "scale(1.02)";
            head.style.transition = "transform 0.5s ease";
        }
    </script>
</body>
</html>
