<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gideon Riggins | Cyber Grid</title>
    <style>
        /* Core System Matrix and Interface Display Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #020308;
            color: #f1f5f9;
            font-family: monospace;
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glowing Nebula Nodes */
        .nebula {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(160px);
            z-index: 2;
            opacity: 0.15;
            transition: all 0.5s ease-in-out;
        }
        .purple { top: -10%; left: -10%; background: #6d28d9; }
        .cyan { bottom: -10%; right: -10%; background: #0e7490; }

        /* Retro CRT HUD Monitor Monitor Scanlines */
        .hud-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: linear-gradient(rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 4px 4px;
            pointer-events: none;
            opacity: 0.4;
        }

        .interface-grid {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            height: 100vh;
            justify-content: space-between;
        }

        header {
            width: 100%;
            max-w: 1100px;
            display: flex;
            justify-content: space-between;
            color: #334155;
            font-size: 0.75rem;
            letter-spacing: 3px;
        }
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #22d3ee;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #22d3ee;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: auto;
        }

        /* High-fidelity Game Status Header text */
        #status-display {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #22d3ee;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        /* 3x3 Matrix Game Board Structure */
        .tic-tac-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 12px;
            background: rgba(4, 7, 20, 0.4);
            padding: 12px;
            border: 1px solid #1e293b;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Individual Board Cell Switches */
        .cell-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: monospace;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .cell-btn:hover {
            border-color: #334155;
            background: rgba(30, 41, 59, 0.5);
        }
        .cell-btn.x-mark { color: #22d3ee; text-shadow: 0 0 15px rgba(34, 211, 238, 0.5); }
        .cell-btn.o-mark { color: #c084fc; text-shadow: 0 0 15px rgba(192, 132, 252, 0.5); }

        /* Mechanical Reset Controller Button */
        .reset-btn {
            background: transparent;
            border: 1px solid #1e293b;
            padding: 0.8rem 2rem;
            color: #64748b;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: monospace;
            margin-top: 1rem;
        }
        .reset-btn:hover {
            border-color: #cbd5e1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }

        footer {
            width: 100%;
            max-w: 1100px;
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #1e293b;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <!-- Silent Visual Engine Arrays -->
    <canvas id="starfield"></canvas>
    <div id="neb-p" class="nebula purple"></div>
    <div id="neb-c" class="nebula cyan"></div>
    <div class="hud-overlay"></div>

    <div class="interface-grid">
        <header>
            <div>GIDEON_GRID_ENGINE</div>
            <div><span class="live-dot" id="sys-dot"></span>SYS.STANDBY</div>
        </header>

        <main>
            <!-- Matrix Turn Status Logger Block -->
            <div id="status-display">Player X's Turn</div>

            <!-- Active 3x3 Input Nodes -->
            <div class="tic-tac-grid">
                <button class="cell-btn" data-index="0" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="1" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="2" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="3" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="4" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="5" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="6" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="7" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="8" onclick="cellClicked(this)"></button>
            </div>

            <button class="reset-btn" onclick="clearGridEngine()">Reset Game Matrix</button>
        </main>

        <footer>
            <div>&copy; 2026 RIGGINS. APPLICATION_LAYER.</div>
            <div>SEC_GRID</div>
        </footer>
    </div>

    <script>
        // Star Particle Loop Calculation Engine
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 130;
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.6,
                speedX: (Math.random() - 0.5) * 0.15,
                speedY: (Math.random() - 0.5) * 0.15,
                alpha: Math.random()
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX - window.innerWidth / 2) * 0.05;
            mouse.targetY = (e.clientY - window.innerHeight / 2) * 0.05;
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;

                if(star.x < 0) star.x = canvas.width;
                if(star.x > canvas.width) star.x = 0;
                if(star.y < 0) star.y = canvas.height;
                if(star.y > canvas.height) star.y = 0;

                ctx.beginPath();
                ctx.globalAlpha = Math.abs(Math.sin(star.alpha));
                star.alpha += 0.008;
                ctx.arc(star.x + mouse.x * star.size, star.y + mouse.y * star.size, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // GAME LOGIC CORE PLATFORM
        let currentPlayer = "X";
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        const statusDisplay = document.getElementById('status-display');
        const nebP = document.getElementById('neb-p');
        const nebC = document.getElementById('neb-c');
        const sysDot = document.getElementById('sys-dot');

        const winPatterns = [, [3, 4, 5], [6, 7, 8], // Horizontal rows, [1, 4, 7], [2, 5, 8], // Vertical columns, [2, 4, 6]             // Diagonals
        ];

        function cellClicked(cell) {
            const index = cell.getAttribute('data-index');

            if (gameState[index] !== "" || !isGameActive) return;

            gameState[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add(currentPlayer === "X" ? "x-mark" : "o-mark");

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winPatterns.length; i++) {
                const condition = winPatterns[i];
                let a = gameState[condition[0]];
                let b = gameState[condition[1]];
                let c = gameState[condition[2]];

                if (a === "" || b === "" || c === "") continue;
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `Player ${currentPlayer} Wins!`;
                statusDisplay.style.color = "#4ade80"; // Bright Green
                sysDot.style.backgroundColor = "#4ade80";
                sysDot.style.boxShadow = "0 0 8px #4ade80";
                
                // Shift background nebulas to green celebration state
                nebP.style.background = "#15803d";
                nebC.style.background = "#14532d";
                
                isGameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                statusDisplay.innerText = "Matrix Lock: Draw!";
                statusDisplay.style.color = "#94a3b8";
                isGameActive = false;
                return;
            }

            // Switch to opposite target player array lock
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerText = `Player ${currentPlayer}'s Turn`;
        }

        function clearGridEngine() {
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            
            statusDisplay.innerText = "Player X's Turn";
            statusDisplay.style.color = "#22d3ee";
            sysDot.style.backgroundColor = "#22d3ee";
            sysDot.style.boxShadow = "0 0 8px #22d3ee";
            
            nebP.style.background = "#6d28d9";
            nebC.style.background = "#0e7490";

            document.querySelectorAll('.cell-btn').forEach(cell => {
                cell.innerText = "";
                cell.className = "cell-btn";
            });
        }
    </script>
</body>
</html>
