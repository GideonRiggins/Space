<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space | Privacy Engine</title>
    <style>
        /* Base Setup & Ultra-Minimal UI Framework */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #03050c;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Low-Opacity Space Nebula Fields */
        .nebula {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 2;
            opacity: 0.12;
            animation: cosmicDrift 25s infinite alternate ease-in-out;
        }
        .purple { top: -10%; left: -10%; background: #6366f1; }
        .cyan { bottom: -10%; right: -10%; background: #06b6d4; animation-duration: 35s; }

        @keyframes cosmicDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(40px, -40px); }
        }

        .hud-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: linear-gradient(rgba(15, 23, 42, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(15, 23, 42, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 4px 4px;
            pointer-events: none;
            opacity: 0.2;
        }

        .interface-grid {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-w: 1100px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: #334155;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-w: 900px;
            margin-bottom: auto;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        h1 span {
            background: linear-gradient(to right, #06b6d4, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphic Active Search Form Input Bar */
        .search-form {
            width: 100%;
            max-w: 640px;
            position: relative;
            margin-bottom: 2rem;
        }
        .search-bar {
            width: 100%;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            padding: 1.1rem 1.5rem;
            padding-left: 3rem;
            border-radius: 14px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            font-family: monospace;
        }
        .search-bar:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        /* ZERO-REDIRECT RESULT DISPLAY FRAME */
        .mainframe-display {
            width: 100%;
            height: 550px;
            background: #ffffff; /* DuckDuckGo's raw HTML results render cleanly over white */
            border: 1px solid rgba(51, 65, 85, 0.4);
            border-radius: 14px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6);
            display: none; /* Triggers open naturally when search executes */
            overflow: hidden;
        }
        .mainframe-display iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            width: 100%;
            max-w: 1100px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.65rem;
            color: #1e293b;
            border-top: 1px solid rgba(51, 65, 85, 0.1);
            padding-top: 1.5rem;
            margin-top: 2rem;
        }
        footer a { color: #1e293b; text-decoration: none; }
    </style>
</head>
<body>

    <!-- Ambient Visual Animation Layer Backplane -->
    <canvas id="starfield"></canvas>
    <div class="nebula purple"></div>
    <div class="nebula cyan"></div>
    <div class="hud-overlay"></div>

    <div class="interface-grid">
        <header>
            <div>Space Mainframe</div>
            <div style="color: #475569;">Embedded Node Active</div>
        </header>

        <main>
            <h1>Space<span>.Search</span></h1>
            
            <!-- Native Form Intercept Target Routing directly into internal iframe -->
            <form action="https://html.duckduckgo.com/html/" method="get" target="search_viewport" onsubmit="revealViewport()" class="search-form">
                <div class="search-wrapper">
                    <svg class="search-icon" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <!-- Core search query input -->
                    <input type="text" name="q" class="search-bar" placeholder="Search web database files raw..." autocomplete="off" autofocus required>
                </div>
            </form>

            <!-- ZERO-REDIRECT INLINE DISPLAY MAIN WINDOW -->
            <div id="displayContainer" class="mainframe-display">
                <iframe name="search_viewport" src="about:blank"></iframe>
            </div>
        </main>

        <footer>
            <div>&copy; 2026 GIDEON RIGGINS.</div>
            <div><a href="https://github.com" target="_blank">MAIN_NODE.SRC</a></div>
        </footer>
    </div>

    <!-- Active Mouse-Tracking Star Field Loop Logic Script -->
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 130;
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                speedX: (Math.random() - 0.5) * 0.12,
                speedY: (Math.random() - 0.5) * 0.12,
                alpha: Math.random()
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX - window.innerWidth / 2) * 0.04;
            mouse.targetY = (e.clientY - window.innerHeight / 2) * 0.04;
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;

                if(star.x < 0) star.x = canvas.width;
                if(star.x > canvas.width) star.x = 0;
                if(star.y < 0) star.y = canvas.height;
                if(star.y > canvas.height) star.y = 0;

                ctx.beginPath();
                ctx.globalAlpha = Math.abs(Math.sin(star.alpha));
                star.alpha += 0.006;
                ctx.arc(star.x + mouse.x * star.size, star.y + mouse.y * star.size, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Reveal the result module naturally upon submission
        function revealViewport() {
            document.getElementById('displayContainer').style.display = "block";
        }
    </script>
</body>
</html>
