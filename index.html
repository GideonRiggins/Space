<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gideon Riggins | Executive Grid</title>
    <style>
        /* Modern Reset & Corporate Mainframe Framework */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #05070f;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Sophisticated Low-Opacity Nebula Clouds */
        .nebula {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(160px);
            z-index: 2;
            opacity: 0.12;
            transition: background 0.8s ease, transform 1s ease;
        }
        .purple { top: -10%; left: -10%; background: #6366f1; }
        .cyan { bottom: -10%; right: -10%; background: #06b6d4; }

        /* Crisp CRT HUD Texture Overlay */
        .hud-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            background: linear-gradient(rgba(15, 23, 42, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(15, 23, 42, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 4px 4px;
            pointer-events: none;
            opacity: 0.3;
        }

        .interface-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 2rem;
            height: 100vh;
            justify-content: space-between;
        }

        header {
            width: 100%;
            max-w: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #475569;
        }
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #06b6d4;
            border-radius: 50%;
            box-shadow: 0 0 8px #06b6d4;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: auto;
        }

        /* Professional Telemetry Scoreboard */
        .scoreboard {
            display: flex;
            gap: 2rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.4);
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            backdrop-filter: blur(8px);
        }
        .score-val { color: #ffffff; font-weight: bold; margin-left: 4px; }

        #status-display {
            font-family: monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #06b6d4;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Matte Frosted 3x3 Dashboard Grid */
        .tic-tac-grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 10px;
            background: rgba(10, 15, 30, 0.4);
            padding: 14px;
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6);
        }

        /* Glassmorphic Board Cell Nodes */
        .cell-btn {
            background: rgba(20, 30, 50, 0.3);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 8px;
            font-size: 2rem;
            font-family: monospace;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .cell-btn:hover {
            border-color: rgba(148, 163, 184, 0.5);
            background: rgba(30, 41, 59, 0.4);
        }
        .cell-btn.x-mark { color: #06b6d4; text-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        .cell-btn.o-mark { color: #a855f7; text-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }

        /* Minimalist Reset Execution Control */
        .reset-btn {
            background: transparent;
            border: 1px solid rgba(51, 65, 85, 0.6);
            padding: 0.75rem 2.2rem;
            color: #64748b;
            font-size: 0.7rem;
            font-family: monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .reset-btn:hover {
            border-color: #94a3b8;
            color: #f8fafc;
            background: rgba(255,255,255,0.02);
        }

        footer {
            width: 100%;
            max-w: 1000px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.65rem;
            color: #334155;
            border-top: 1px solid rgba(51, 65, 85, 0.2);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Professional Presentation Layer Controls -->
    <canvas id="starfield"></canvas>
    <div id="neb-p" class="nebula purple"></div>
    <div id="neb-c" class="nebula cyan"></div>
    <div class="hud-overlay"></div>

    <div class="interface-container">
        <header>
            <div>GIDEON RIGGINS</div>
            <div class="live-indicator"><span class="live-dot" id="sys-dot"></span><span id="header-status">CORE.READY</span></div>
        </header>

        <main>
            <!-- System Telemetry Tally Box -->
            <div class="scoreboard">
                <div>WINS:<span class="score-val" id="count-w">0</span></div>
                <div>LOSSES:<span class="score-val" id="count-l">0</span></div>
                <div>DRAWS:<span class="score-val" id="count-d">0</span></div>
            </div>

            <!-- Active Turn Indicator -->
            <div id="status-display">Your Turn (X)</div>

            <!-- Dashboard 3x3 Game Board Matrix -->
            <div class="tic-tac-grid">
                <button class="cell-btn" data-index="0" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="1" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="2" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="3" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="4" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="5" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="6" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="7" onclick="cellClicked(this)"></button>
                <button class="cell-btn" data-index="8" onclick="cellClicked(this)"></button>
            </div>

            <button class="reset-btn" onclick="clearGridEngine()">Clear Terminal Matrix</button>
        </main>

        <footer>
            <div>&copy; 2026 RIGGINS. ENTERPRISE NODE.</div>
            <div>STATUS: STABLE</div>
        </footer>
    </div>

    <script>
        // High-Performance Silent Vector Canvas Engine
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 120;
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                speedX: (Math.random() - 0.5) * 0.12,
                speedY: (Math.random() - 0.5) * 0.12,
                alpha: Math.random()
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX - window.innerWidth / 2) * 0.04;
            mouse.targetY = (e.clientY - window.innerHeight / 2) * 0.04;
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;
            
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;

                if(star.x < 0) star.x = canvas.width;
                if(star.x > canvas.width) star.x = 0;
                if(star.y < 0) star.y = canvas.height;
                if(star.y > canvas.height) star.y = 0;

                ctx.beginPath();
                ctx.globalAlpha = Math.abs(Math.sin(star.alpha));
                star.alpha += 0.006;
                ctx.arc(star.x + mouse.x * star.size, star.y + mouse.y * star.size, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // PERSISTENT PRODUCTION DATA ENGINE
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        let stats = { w: 0, l: 0, d: 0 };

        const statusDisplay = document.getElementById('status-display');
        const hStatus = document.getElementById('header-status');
        const nebP = document.getElementById('neb-p');
        const nebC = document.getElementById('neb-c');
        const sysDot = document.getElementById('sys-dot');

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontal
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertical
            [0, 4, 8], [2, 4, 6]             // Diagonal
        ];

        function cellClicked(cell) {
            const index = cell.getAttribute('data-index');
            if (gameState[index] !== "" || !isGameActive || statusDisplay.innerText === "COMPILING ANSWER...") return;

            // Human Turn (X)
            gameState[index] = "X";
            cell.innerText = "X";
            cell.classList.add("x-mark");

            if (checkResult("X")) return;

            statusDisplay.innerText = "COMPILING ANSWER...";
            setTimeout(executeAIMove, 400);
        }

        function executeAIMove() {
            if (!isGameActive) return;

            let emptyIndices = [];
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") emptyIndices.push(i);
            }

            if (emptyIndices.length === 0) return;

            let chosenIndex = findStrategicMove("O"); // Win check
            if (chosenIndex === -1) chosenIndex = findStrategicMove("X"); // Block check

            if (chosenIndex === -1) {
                const randomIndex = Math.floor(Math.random() * emptyIndices.length);
                chosenIndex = emptyIndices[randomIndex];
            }

            gameState[chosenIndex] = "O";
            const targetCell = document.querySelector(`[data-index="${chosenIndex}"]`);
            targetCell.innerText = "O";
            targetCell.classList.add("o-mark");

            if (checkResult("O")) return;

            statusDisplay.innerText = "Your Turn (X)";
        }

        function findStrategicMove(playerMark) {
            for (let i = 0; i < winPatterns.length; i++) {
                const [a, b, c] = winPatterns[i];
                if (gameState[a] === playerMark && gameState[b] === playerMark && gameState[c] === "") return c;
                if (gameState[a] === playerMark && gameState[c] === playerMark && gameState[b] === "") return b;
                if (gameState[b] === playerMark && gameState[c] === playerMark && gameState[a] === "") return a;
            }
            return -1;
        }

        function checkResult(player) {
            let roundWon = false;

            for (let i = 0; i < winPatterns.length; i++) {
                const [a, b, c] = winPatterns[i];
                if (gameState[a] === player && gameState[b] === player && gameState[c] === player) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                if (player === "X") {
                    statusDisplay.innerText = "TERMINAL DEPLOYMENT SUCCESSFUL";
                    statusDisplay.style.color = "#10b981"; // Professional Emerald
                    hStatus.innerText = "USER.VICTORY";
                    sysDot.style.backgroundColor = "#10b981";
                    sysDot.style.boxShadow = "0 0 10px #10b981";
                    nebP.style.background = "#064e3b";
                    nebC.style.background = "#022c22";
                    stats.w++;
                    document.getElementById('count-w').innerText = stats.w;
                } else {
                    statusDisplay.innerText = "SYSTEM ERROR: CORE REJECTED";
                    statusDisplay.style.color = "#ef4444"; // Professional Crimson
                    hStatus.innerText = "SYS.OVERRIDE";
                    sysDot.style.backgroundColor = "#ef4444";
                    sysDot.style.boxShadow = "0 0 10px #ef4444";
                    nebP.style.background = "#7f1d1d";
                    nebC.style.background = "#450a0a";
                    stats.l++;
                    document.getElementById('count-l').innerText = stats.l;
                }
                isGameActive = false;
                return true;
            }

            if (!gameState.includes("")) {
                statusDisplay.innerText = "DATA CONFLICT: ARCHIVE DRAW";
                statusDisplay.style.color = "#64748b";
                hStatus.innerText = "LINK.STABLE";
                stats.d++;
                document.getElementById('count-d').innerText = stats.d;
                isGameActive = false;
                return true;
            }

            return false;
        }

        function clearGridEngine() {
            gameState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            
            statusDisplay.innerText = "Your Turn (X)";
            statusDisplay.style.color = "#06b6d4";
            hStatus.innerText = "CORE.READY";
            sysDot.style.backgroundColor = "#06b6d4";
            sysDot.style.boxShadow = "0 0 8px #06b6d4";
            
            nebP.style.background = "#6366f1";
            nebC.style.background = "#06b6d4";

            document.querySelectorAll('.cell-btn').forEach(cell => {
                cell.innerText = "";
                cell.className = "cell-btn";
            });
        }
    </script>
</body>
</html>
