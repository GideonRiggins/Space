<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photorealistic Sky Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 100%, #1e3c72 0%, #111e36 60%, #070b12 100%);
        }

        .sky-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 800px;
            perspective-origin: 50% 50%;
            overflow: hidden;
            z-index: 1;
        }

        .sky-lighting {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 50% 30%, rgba(135, 206, 250, 0.15) 0%, rgba(0,0,0,0) 50%),
                radial-gradient(circle at 10% 20%, rgba(255, 138, 138, 0.08) 0%, rgba(0,0,0,0) 40%);
            mix-blend-mode: screen;
            z-index: 2;
            pointer-events: none;
        }

        .starfield {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
            transform: rotate(-15deg);
            animation: cosmicShift 180s linear infinite;
        }

        .cloud-system {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .cloud-formation {
            position: absolute;
            width: 650px;
            height: 300px;
            top: var(--top);
            transform-style: preserve-3d;
            animation: grandDrift var(--speed) linear infinite;
            animation-delay: var(--delay);
            opacity: 0;
            will-change: transform, opacity;
        }

        .vapor-node {
            position: absolute;
            background: radial-gradient(circle at var(--px) var(--py), 
                rgba(255, 255, 255, 0.88) 0%, 
                rgba(242, 246, 253, 0.75) 20%, 
                rgba(174, 195, 222, 0.35) 55%, 
                rgba(30, 50, 85, 0.0) 75%);
            border-radius: 50%;
            filter: blur(40px);
            mix-blend-mode: color-dodge;
            width: var(--size);
            height: var(--size);
            top: var(--y);
            left: var(--x);
            transform: translateZ(var(--z));
        }

        .vapor-shadow {
            position: absolute;
            background: radial-gradient(circle at center, rgba(10, 18, 36, 0.45) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            mix-blend-mode: multiply;
            width: calc(var(--size) * 1.2);
            height: calc(var(--size) * 0.9);
            top: calc(var(--y) + 30px);
            left: calc(var(--x) - 10px);
            transform: translateZ(calc(var(--z) - 10px));
            opacity: 0.8;
        }

        @keyframes grandDrift {
            0% {
                transform: translateX(-750px) translateZ(var(--z)) scale(var(--scale));
                opacity: 0;
            }
            8% { opacity: var(--max-op); }
            90% { opacity: var(--max-op); }
            100% {
                transform: translateX(105vw) translateZ(var(--z)) scale(var(--scale));
                opacity: 0;
            }
        }

        @keyframes cosmicShift {
            0% { transform: rotate(-15deg) translate(0, 0); }
            100% { transform: rotate(-15deg) translate(-100px, 50px); }
        }

        .overlay-ui {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        .central-console {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding: 60px 50px;
            border-radius: 32px;
            text-align: center;
            max-width: 600px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: auto;
            cursor: pointer;
        }

        .central-console:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 5px rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 200;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 24px;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        p {
            color: #9cb3d0;
            font-size: 1rem;
            line-height: 1.8;
            letter-spacing: 1px;
            font-weight: 300;
            margin-bottom: 35px;
        }

        .action-node {
            display: inline-block;
            padding: 14px 36px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .action-node::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }

        .action-node:hover {
            background: #ffffff;
            color: #070b12;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .action-node:hover::before { left: 100%; }
    </style>
</head>
<body>
    <div class="sky-viewport" id="viewport">
        <div class="sky-lighting"></div>
        <div class="starfield"></div>
        
        <div class="cloud-system" id="cloudSystem">
            <!-- Cloud Formation 1: Foreground Giant -->
            <div class="cloud-formation" style="--top: 10%; --speed: 40s; --delay: -5s; --z: 180px; --scale: 1.4; --max-op: 0.95;">
                <div class="vapor-shadow" style="--size:320px; --x:20px; --y:40px; --z:180px;"></div>
                <div class="vapor-node" style="--size:320px; --x:20px; --y:40px; --z:180px; --px:35%; --py:35%;"></div>
                <div class="vapor-shadow" style="--size:280px; --x:180px; --y:10px; --z:160px;"></div>
                <div class="vapor-node" style="--size:280px; --x:180px; --y:10px; --z:160px; --px:45%; --py:25%;"></div>
                <div class="vapor-node" style="--size:240px; --x:340px; --y:60px; --z:190px; --px:30%; --py:40%;"></div>
            </div>

            <!-- Cloud Formation 2: Deep Ambient Horizon -->
            <div class="cloud-formation" style="--top: -5%; --speed: 95s; --delay: -45s; --z: -250px; --scale: 0.7; --max-op: 0.45;">
                <div class="vapor-node" style="--size:400px; --x:40px; --y:10px; --z:-250px; --px:50%; --py:50%;"></div>
                <div class="vapor-node" style="--size:350px; --x:260px; --y:-30px; --z:-270px; --px:40%; --py:40%;"></div>
            </div>

            <!-- Cloud Formation 3: Midground Standard -->
            <div class="cloud-formation" style="--top: 35%; --speed: 62s; --delay: -18s; --z: 20px; --scale: 1.0; --max-op: 0.8;">
                <div class="vapor-shadow" style="--size:260px; --x:50px; --y:50px; --z:20px;"></div>
                <div class="vapor-node" style="--size:260px; --x:50px; --y:50px; --z:20px; --px:30%; --py:30%;"></div>
                <div class="vapor-shadow" style="--size:310px; --x:160px; --y:15px; --z:40px;"></div>
                <div class="vapor-node" style="--size:310px; --x:160px; --y:15px; --z:40px; --px:45%; --py:35%;"></div>
                <div class="vapor-shadow" style="--size:220px; --x:360px; --y:70px; --z:10px;"></div>
                <div class="vapor-node" style="--size:220px; --x:360px; --y:70px; --z:10px; --px:50%; --py:50%;"></div>
            </div>

            <!-- Cloud Formation 4: Low Midground Track -->
            <div class="cloud-formation" style="--top: 60%; --speed: 78s; --delay: -55s; --z: -60px; --scale: 1.15; --max-op: 0.75;">
                <div class="vapor-shadow" style="--size:290px; --x:30px; --y:30px; --z:-60px;"></div>
                <div class="vapor-node" style="--size:290px; --x:30px; --y:30px; --z:-60px; --px:40%; --py:30%;"></div>
                <div class="vapor-shadow" style="--size:340px; --x:180px; --y:40px; --z:-40px;"></div>
                <div class="vapor-node" style="--size:340px; --x:180px; --y:40px; --z:-40px; --px:50%; --py:50%;"></div>
            </div>
        </div>
    </div>

    <main class="overlay-ui">
        <div class="central-console" id="interactiveCard">
            <h1>Nirvana</h1>
            <p>A precision-coded sky rendering engine leveraging internal volumetric dark shadows, light scatter ray simulations, and mouse-bound physical parallax parameters.</p>
            <div class="action-node">Initialize Engine</div>
        </div>
    </main>

    <script>
        const viewport = document.getElementById('viewport');
        const cloudSystem = document.getElementById('cloudSystem');
        const interactiveCard = document.getElementById('interactiveCard');

        window.addEventListener('mousemove', (e) => {
            const mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

            cloudSystem.style.transform = `translateX(${mouseX * 45}px) translateY(${mouseY * 25}px)`;
            
            const cardRotateX = mouseY * -15; 
            const cardRotateY = mouseX * 15;  
            interactiveCard.style.transform = `rotateX(${cardRotateX}deg) rotateY(${cardRotateY}deg) translateZ(30px)`;
        });

        window.addEventListener('mouseleave', () => {
            cloudSystem.style.transform = `translateX(0px) translateY(0px)`;
            interactiveCard.style.transform = `rotateX(0deg) rotateY(0deg) translateZ(0px)`;
        });
    </script>
</body>
</html>
