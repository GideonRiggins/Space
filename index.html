<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Space</title>
    <style>
        /* Base Setup */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100%; 
            background-color: #040614; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Moving Space Background Loop */
        .universe {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 1px, transparent 1px),
                radial-gradient(circle at 75% 60%, rgba(255,255,255,0.1) 2px, transparent 2px),
                radial-gradient(circle at 50% 85%, rgba(255,255,255,0.12) 1px, transparent 1px);
            background-size: 400px 400px;
            animation: moveStars 90s linear infinite;
        }
        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 400px 800px; }
        }

        /* Glowing Nebula Gas Clouds */
        .nebula {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 2;
            opacity: 0.4;
            animation: drift 15s ease-in-out infinite alternate;
        }
        .purple { top: -10%; left: -10%; background: #7c3aed; }
        .cyan { bottom: -10%; right: -10%; background: #06b6d4; animation-delay: -5s; }

        @keyframes drift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(40px, -40px); }
        }

        /* Layout Framework */
        .interface {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        header { width: 100%; max-w: 1000px; display: flex; justify-content: space-between; font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; color: #94a3b8; }
        
        main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; max-w: 600px; margin: auto; }
        
        /* Shifting Vector Text Color */
        h1 { 
            font-size: 4rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #94a3b8; line-height: 1.6; font-size: 1rem; font-weight: 300; }

        /* Cyberpunk Interactive Core Button */
        button {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            padding: 1rem 2rem;
            color: #cbd5e1;
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        button:hover { border-color: #22d3ee; color: #22d3ee; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }

        footer { font-size: 0.65rem; font-family: monospace; color: #475569; }
    </style>
</head>
<body>

    <!-- Backplane Elements -->
    <div class="universe"></div>
    <div class="nebula purple"></div>
    <div class="nebula cyan"></div>

    <!-- Active Interface -->
    <div class="interface">
        <header>
            <div>Cosmic Space</div>
            <div style="color:#475569;">v1.0.5</div>
        </header>

        <main>
            <h1 id="title-text">Explore The Unknown</h1>
            <p>Live on the web. Clean, fast, and entirely custom. Step into a lightweight engine engineered for optimal performance across the digital expanse.</p>
            <button onclick="engage(this)">Initialize Sequence</button>
        </main>

        <footer>
            &copy; 2026 Gideon Riggins. Terminal functional.
        </footer>
    </div>

    <script>
        function engage(element) {
            element.innerText = "System Loading...";
            element.style.color = "#a78bfa";
            element.style.borderColor = "#a78bfa";
            
            setTimeout(() => {
                element.innerText = "Sequence Active";
                element.style.color = "#4ade80";
                element.style.borderColor = "#4ade80";
                document.getElementById('title-text').style.background = "linear-gradient(to right, #4ade80, #22d3ee)";
                document.getElementById('title-text').style.webkitBackgroundClip = "text";
            }, 1200);
        }
    </script>

</body>
</html>
