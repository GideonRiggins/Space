<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Space</title>
</head>
<body style="margin: 0; padding: 0; background-color: #05070f; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; justify-content: space-between; min-h: 100vh; height: 100vh; text-align: center;">

    <!-- Top Row Header -->
    <header style="padding: 20px; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: #22d3ee;">
        Cosmic Space
    </header>

    <!-- Center Interactive Content -->
    <main style="max-w: 500px; margin: auto; padding: 20px;">
        <h1 style="font-size: 3.5rem; text-transform: uppercase; margin-bottom: 10px; color: #ffffff;">Explore The Unknown</h1>
        <p style="color: #94a3b8; line-height: 1.6; margin-bottom: 30px;">Live on the web. Clean, fast, and entirely custom.</p>
        
        <button onclick="this.innerText='Sequence Active'; this.style.color='#4ade80'; this.style.borderColor='#4ade80';" style="background: transparent; border: 1px solid #334155; padding: 15px 30px; color: #cbd5e1; font-family: monospace; font-size: 12px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;">
            Initialize Sequence
        </button>
    </main>

    <!-- Bottom Status Bar -->
    <footer style="padding: 20px; font-size: 10px; font-family: monospace; color: #475569; border-top: 1px solid #0f172a;">
        &copy; 2026 Gideon Riggins. All systems operational.
    </footer>

</body>
</html>
