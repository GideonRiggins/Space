<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Weather Dashboard</title>
    <style>
        /* Base Setup & Clean Corporate Presentation Framework */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        /* Dashboard Presentation Cards */
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .search-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        input {
            flex: 1;
            padding: 0.75rem 1.2rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #3b82f6;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover {
            background: #2563eb;
        }
        /* Weather Metrics Styling */
        .location-header {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }
        .time-label {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }
        .main-temp {
            font-size: 3.5rem;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
            margin-bottom: 1.5rem;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1.5rem;
        }
        .metric-item-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .metric-item-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #334155;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Row -->
        <div class="card search-row">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Paris, New York)..." autofocus>
            <button onclick="getWeatherData()">Search</button>
        </div>

        <!-- Telemetry Display Card -->
        <div class="card" id="weatherCard" style="display: none;">
            <div class="location-header" id="locName">City Name</div>
            <div class="time-label" id="currentTime">Loading Local Time...</div>
            
            <div class="main-temp" id="tempDisplay">--°C</div>
            
            <div class="metrics-grid">
                <div>
                    <div class="metric-item-label">Wind Speed</div>
                    <div class="metric-item-value" id="windDisplay">-- km/h</div>
                </div>
                <div>
                    <div class="metric-item-label">Wind Direction</div>
                    <div class="metric-item-value" id="directionDisplay">--°</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Gideon Riggins. Open-source environmental terminal layers.
    </footer>

    <script>
        // Bind the Enter key to trigger the search naturally
        document.getElementById('cityInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                getWeatherData();
            }
        });

        // ASYNCHRONOUS WEATHER EXTRACTION ENGINE
        function getWeatherData() {
            const cityName = document.getElementById('cityInput').value.trim();
            if (!cityName) return;

            const card = document.getElementById('weatherCard');
            const locName = document.getElementById('locName');
            const tempDisplay = document.getElementById('tempDisplay');
            const windDisplay = document.getElementById('windDisplay');
            const directionDisplay = document.getElementById('directionDisplay');
            const timeLabel = document.getElementById('currentTime');

            // Accessing open-source coordinates geocoding metrics
            const geoUrl = `https://open-meteo.com{encodeURIComponent(cityName)}&count=1&language=en&format=json`;

            fetch(geoUrl)
                .then(res => res.json())
                .then(geoData => {
                    if (!geoData.results || geoData.results.length === 0) {
                        alert("City location vector not found.");
                        return;
                    }

                    // FIXED: Explicitly grab the first dictionary item index from the data results array
                    const location = geoData.results[0];
                    const lat = location.latitude;
                    const lon = location.longitude;
                    
                    locName.innerText = `${location.name}, ${location.country || 'Global Node'}`;
                    timeLabel.innerText = `Coordinates: ${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`;

                    // Fetch actual atmospheric datasets based on geocoded pins
                    const weatherUrl = `https://open-meteo.com{lat}&longitude=${lon}&current_weather=true`;

                    return fetch(weatherUrl);
                })
                .then(res => {
                    if (!res) return;
                    return res.json();
                })
                .then(weatherData => {
                    if (!weatherData || !weatherData.current_weather) return;

                    const current = weatherData.current_weather;
                    
                    // Render raw telemetry data streams into page components
                    tempDisplay.innerText = `${current.temperature}°C`;
                    windDisplay.innerText = `${current.windspeed} km/h`;
                    directionDisplay.innerText = `${current.winddirection}°`;

                    card.style.display = "block";
                })
                .catch((err) => {
                    console.error(err);
                    alert("Network connection exception. Could not connect to environmental database layers.");
                });
        }
    </script>
</body>
</html>
