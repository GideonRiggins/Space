<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gideon Riggins | Photo Engine</title>
    <style>
        /* Modern Setup and Reset Layout Geometry */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #090b11;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-badge {
            font-size: 0.75rem;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 9999px;
            color: #94a3b8;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 🖼️ AUTOMATED MASONRY FLOW PHOTO GRID */
        .photo-gallery {
            column-count: 1;
            column-gap: 1.5rem;
            width: 100%;
        }

        /* Responsive column distribution rules based on monitor size */
        @media (min-width: 480px) { .photo-gallery { column-count: 2; } }
        @media (min-width: 768px) { .photo-gallery { column-count: 3; } }
        @media (min-width: 1024px) { .photo-gallery { column-count: 4; } }

        .photo-card {
            background: #111420;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            break-inside: avoid;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
        }

        .photo-card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            background-color: #0e111a; /* Placeholder skeleton color while loading */
        }

        .photo-meta {
            padding: 1rem;
            font-size: 0.8rem;
            color: #64748b;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-tag {
            color: #e2e8f0;
            font-weight: bold;
        }

        footer {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #334155;
            border-t: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Gideon Riggins / Photo.Archive</h1>
        <div class="upload-badge">GRID STATUS: OPERATIONAL</div>
    </header>

    <main>
        <!-- MULTI-COLUMN PHOTO FEED (Populated with premium high-res placeholders) -->
        <div class="photo-gallery">
            
            <div class="photo-card">
                <img src="https://unsplash.com" alt="Cosmic Texture">
                <div class="photo-meta"><span class="photo-tag">#001_NEBULA</span><span>600x800</span></div>
            </div>

            <div class="photo-card">
                <img src="https://unsplash.com" alt="Digital Matrix Network">
                <div class="photo-meta"><span class="photo-tag">#002_MATRIX</span><span>600x400</span></div>
            </div>

            <div class="photo-card">
                <img src="https://unsplash.com" alt="Abstract Fluid Flow">
                <div class="photo-meta"><span class="photo-tag">#003_FLUID</span><span>600x900</span></div>
            </div>

            <div class="photo-card">
                <img src="https://unsplash.com" alt="Cyber Grid Core">
                <div class="photo-meta"><span class="photo-tag">#004_CIRCUIT</span><span>600x600</span></div>
            </div>

            <div class="photo-card">
                <img src="https://unsplash.com" alt="Satellite View">
                <div class="photo-meta"><span class="photo-tag">#005_HORIZON</span><span>600x450</span></div>
            </div>

            <div class="photo-card">
                <img src="https://unsplash.com" alt="Gradients Layer">
                <div class="photo-meta"><span class="photo-tag">#006_VECTOR</span><span>600x750</span></div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Gideon Riggins. Media storage module loaded.
    </footer>

</body>
</html>
