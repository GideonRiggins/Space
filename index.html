<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Floating Clouds Website</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(to bottom, #1a1c2e 0%, #394168 50%, #7d6f8d 100%);
            color: #ffffff;
        }

        /* Animated Cloud Background Container */
        .sky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* Base Cloud Styling */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 100px;
            filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.1));
            animation: float linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        /* Cloud Shapes */
        .cloud-style-1 {
            width: 200px;
            height: 60px;
        }
        .cloud-style-1::before {
            width: 80px;
            height: 80px;
            top: -40px;
            left: 30px;
        }
        .cloud-style-1::after {
            width: 100px;
            height: 100px;
            top: -50px;
            right: 30px;
        }

        .cloud-style-2 {
            width: 300px;
            height: 90px;
            background: rgba(255, 255, 255, 0.08);
        }
        .cloud-style-2::before {
            width: 120px;
            height: 120px;
            top: -60px;
            left: 40px;
        }
        .cloud-style-2::after {
            width: 150px;
            height: 150px;
            top: -85px;
            right: 40px;
        }

        /* Cloud Instances with Individual Speed and Placement */
        .c1 { top: 10%; animation-duration: 35s; transform: scale(0.6); }
        .c2 { top: 35%; animation-duration: 55s; transform: scale(1.1); animation-delay: -10s; }
        .c3 { top: 60%; animation-duration: 42s; transform: scale(0.8); animation-delay: -25s; }
        .c4 { top: 20%; animation-duration: 70s; transform: scale(1.4); animation-delay: -40s; }
        .c5 { top: 75%; animation-duration: 48s; transform: scale(0.5); animation-delay: -5s; }

        /* Floating Animation Matrix */
        @keyframes float {
            0% {
                left: -350px;
            }
            100% {
                left: 100%;
            }
        }

        /* Foreground Content */
        .main-content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ffffff, #c2ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #d1d5db;
        }

        .cta-btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            color: #1a1c2e;
            background: #ffffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <!-- Floating Clouds Layer -->
    <div class="sky-container">
        <div class="cloud cloud-style-1 c1"></div>
        <div class="cloud cloud-style-2 c2"></div>
        <div class="cloud cloud-style-1 c3"></div>
        <div class="cloud cloud-style-2 c4"></div>
        <div class="cloud cloud-style-1 c5"></div>
    </div>

    <!-- Website Core Content -->
    <main class="main-content">
        <h1>Drift Away</h1>
        <p>Welcome to a sleek, modern interface styled with beautiful CSS-only glassmorphism clouds drifting seamlessly across a twilight sky matrix.</p>
        <button class="cta-btn">Explore More</button>
    </main>

</body>
</html>
