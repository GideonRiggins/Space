<!-- =======================================================================
     SECTION 1: THE GLOBAL STYLES & INTERACTIVE HERO AREA
     ======================================================================= -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Infinite Vortex v3</title>
    <style>
        :root {
            --bg-dark: #050508;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-purple: #9400d3;
            --text-main: #f0f3f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--neon-cyan), var(--neon-magenta));
            border-radius: 4px;
        }

        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        #canvas-ambient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glitch-title {
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: #a0aec0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .cta-btn {
            position: relative;
            display: inline-block;
            padding: 18px 44px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
            border-radius: 50px;
            transition: transform 0.2s ease;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            z-index: -1;
        }

        .cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #63deff;
            animation: pulse 2s infinite;
            cursor: pointer;
        }

        .loop-section {
            min-height: 100vh;
            background: #0b0c10;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .section-header {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .interactive-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .interactive-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .counter-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .card-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #fff;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #8a99ad;
            line-height: 1.5;
        }

        .rush-section {
            min-height: 100vh;
            background: linear-gradient(180deg, #0b0c10 0%, #12031a 100%);
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .reward-box {
            background: rgba(255, 255, 255, 0.01);
            border: 2px dashed rgba(255, 0, 127, 0.2);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .reward-box.active {
            border-color: var(--neon-magenta);
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.3);
            background: rgba(255, 0, 127, 0.02);
        }

        .dopamine-btn {
            background: transparent;
            border: 2px solid var(--neon-magenta);
            color: var(--neon-magenta);
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dopamine-btn:hover {
            background: var(--neon-magenta);
            color: #fff;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.6);
            transform: scale(1.05);
        }

        .level-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -10px); }
        }

        @media (max-width: 768px) {
            .glitch-title { font-size: 2.8rem; }
            .hero-subtitle { font-size: 1.1rem; }
            .section-header { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <section class="hero-section" id="home">
        <canvas id="canvas-ambient"></canvas>
        <div class="hero-content">
            <h1 class="glitch-title">The Next Dimension</h1>
            <p class="hero-subtitle">Experience a fluid architecture designed to capture attention and elevate digital interaction. Smooth physics meet flawless aesthetics.</p>
            <a href="#explore" class="cta-btn">Enter The Void</a>
        </div>
        <div class="scroll-indicator" onclick="document.getElementById('explore').scrollIntoView();">▼ Scroll</div>
    </section>
<!-- =======================================================================
     SECTION 3: THE ENGINE LOGIC & CANVAS FLUID INTERACTION SCRIPT
     ======================================================================= -->
    <script>
        const canvas = document.getElementById('canvas-ambient');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;

                if (mouse.x != null && mouse.y != null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = dx / distance;
                        let directionY = dy / distance;
                        this.x += directionX * force * 3;
                        this.y += directionY * force * 3;
                    }
                }
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 15000));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(148, 0, 211, ${0.15 - dist/120})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        let clicks = 0;
        let elapsedSeconds = 0;
        let energyValue = 100;

        setInterval(() => {
            elapsedSeconds++;
            document.getElementById('time-count').innerText = elapsedSeconds + 's';
            if (elapsedSeconds % 5 === 0 && energyValue > 10) {
                energyValue -= 3;
                document.getElementById('energy-level').innerText = energyValue + '%';
            }
            updateRank();
        }, 1000);

        function triggerIncrement(card, type) {
            if (type === 'clicks') {
                clicks++;
                document.getElementById('click-count').innerText = clicks;
                card.style.transform = 'scale(0.96) translateY(-10px)';
                setTimeout(() => card.style.transform = 'translateY(-10px)', 100);
            } else if (type === 'energy') {
                energyValue = Math.min(100, energyValue + 15);
                document.getElementById('energy-level').innerText = energyValue + '%';
            }
            updateRank();
        }

        function updateRank() {
            const score = clicks + Math.floor(elapsedSeconds / 2);
            let rank = "Tier 1: Novice";
            if (score > 40) rank = "Tier 4: Overlord";
            else if (score > 25) rank = "Tier 3: Architect";
            else if (score > 10) rank = "Tier 2: Adept";
            document.getElementById('rankBadge').innerText = rank;
        }

        function triggerFlash() {
            const box = document.getElementById('rewardBox');
            box.classList.add('active');
            setTimeout(() => box.classList.remove('active'), 600);
            energyValue = 100;
            document.getElementById('energy-level').innerText = '100%';
        }
    </script>
</body>
</html>
